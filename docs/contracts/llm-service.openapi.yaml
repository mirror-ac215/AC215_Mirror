openapi: 3.1.0
info:
  title: Mirror llm-service
  version: 0.1.0
  description: >
    Model server (Qwen2.5-3B-Instruct, no adapter for MS3, see D-006). Uses a subset of
    the OpenAI chat-completions API, so vLLM provides it out of the box.
    MOCK_MODE=1 returns canned replies with the same shape (no GPU needed).
    The api-gateway builds the messages, including the rendered context object.

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Model server is up

  /v1/chat/completions:
    post:
      summary: Generate the persona reply for one chat turn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: >
            Reply. With stream=false: one ChatResponse JSON. With stream=true:
            Server-Sent Events, one chunk per token group, ending with data: [DONE].
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
            text/event-stream:
              schema: { type: string }

components:
  schemas:
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }

    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Served model name
          example: mirror-persona-v1
        messages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Message" }
        max_tokens: { type: integer, minimum: 1, default: 300 }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0.7 }
        stream: { type: boolean, default: false }

    ChatResponse:
      type: object
      required: [choices]
      properties:
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message: { $ref: "#/components/schemas/Message" }
              finish_reason: { type: string, example: stop }