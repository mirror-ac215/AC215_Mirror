openapi: 3.1.0
info:
  title: Mirror api-gateway
  version: 0.1.0
  description: >
    The only service the frontend calls. Handles login, sessions, webcam frames
    (smoothed and gated per session), chat turns (safety check first, then
    fusion into a context object, then the llm-service), and clinician views.
    Endpoints marked (MS4) are planned, not built in MS2.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness check, including downstream services
      security: []
      responses:
        "200":
          description: Gateway is up; each dependency reported separately
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  dependencies:
                    type: object
                    additionalProperties: { type: string, enum: [ok, down] }
                    example: { cv-service: ok, llm-service: ok, db: ok }

  /auth/login:
    post:
      summary: Log in (patient or clinician) and get a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { description: Wrong email or password }
        "429": { description: Too many login attempts from this account/client pair }

  /auth/refresh:
    post:
      summary: Replace a still-valid authenticated token with a fresh token
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { description: Not logged in or token is invalid or expired }

  /sessions:
    post:
      summary: Start a chat session (patient only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [camera_consent]
              properties:
                camera_consent: { type: boolean }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { description: Not logged in }
        "403": { description: Not a patient }

  /sessions/{session_id}/frames:
    post:
      summary: Send one webcam frame (only if camera_consent is true)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, contentMediaType: image/jpeg }
      responses:
        "202":
          description: Frame accepted into the session's smoothing window (never stored)
          content:
            application/json:
              schema:
                type: object
                required: [visual_status]
                properties:
                  visual_status: { type: string, enum: [ok, uncertain, dropped, camera_off] }
                  top2:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items: { $ref: "#/components/schemas/LabelProb" }
                    description: Top two labels smoothed over the gate window, never one frame. Only present when visual_status is ok.
        "401": { description: Not logged in or token is invalid }
        "403": { description: Not the patient who owns this session }
        "404": { description: Unknown session }
        "409": { description: Camera consent was not given for this session }
        "413": { description: Frame larger than the gateway's maximum frame size }
        "415": { description: Frame is not a JPEG image }
        "503": { description: Camera analysis is temporarily unavailable }

  /sessions/{session_id}/messages:
    post:
      summary: Send the patient's message and stream the reply
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: >
            Server-Sent Events. Every `data:` line is JSON (so newlines in the reply are safe).
            Event types:
              crisis: data = CrisisPayload; no persona reply, the stream ends
              token:  data = TokenPayload, the next piece of reply text
              done:   data = DonePayload; the stream ends

            Example, normal turn:
              event: token
              data: {"text": "I hear you."}

              event: token
              data: {"text": " What made today hard?"}

              event: done
              data: {"message_id": "m-123", "context": {...}}

            Example, crisis turn:
              event: crisis
              data: {"message": "...", "resources": [{"name": "988 Suicide & Crisis Lifeline", "contact": "call or text 988"}], "review_flag_created": true}

          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Not logged in or token is invalid }
        "403": { description: Not the patient who owns this session }
        "404": { description: Unknown session }

  /clinician/patients:
    get:
      summary: (MS4) List the clinician's own patients
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Patient list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PatientSummary" }
        "401": { description: Not logged in or token is invalid }
        "403": { description: Not a clinician }

  /clinician/patients/{patient_id}/trend:
    get:
      summary: (MS4) Aggregated emotion trend for one patient
      security: [{ bearerAuth: [] }]
      parameters:
        - name: patient_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One point per stored emotion window
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrendPoint" }
        "401": { description: Not logged in or token is invalid }
        "403": { description: Not this clinician's patient }

  /clinician/review-flags/{flag_id}:
    patch:
      summary: (MS4) Mark a needs-review flag as reviewed
      security: [{ bearerAuth: [] }]
      parameters:
        - name: flag_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewed]
              properties:
                reviewed: { type: boolean, const: true }
      responses:
        "200":
          description: Flag marked as reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewFlagAcknowledgement" }
        "401": { description: Not logged in or token is invalid }
        "403": { description: Not this clinician's patient }
        "422":
          description: Validation Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }

  schemas:
    HTTPValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items: { $ref: "#/components/schemas/ValidationError" }
    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf: [{ type: string }, { type: integer }]
        msg: { type: string }
        type: { type: string }
        ctx: { type: object }
        input: {}
    LabelProb:
      type: array
      description: One label and its probability, as [label, probability].
      prefixItems:
        - { type: string, enum: [angry, disgust, fear, happy, neutral, sad, surprise] }
        - { type: number, minimum: 0, maximum: 1 }
      minItems: 2
      maxItems: 2
      items: false
    TrendLabelProb:
      type: array
      description: One stored visual/text label and probability, as [label, probability].
      prefixItems:
        - { type: string, enum: [anger, angry, disgust, fear, happy, joy, neutral, sad, sadness, surprise] }
        - { type: number, minimum: 0, maximum: 1 }
      minItems: 2
      maxItems: 2
      items: false
    LoginResponse:
      type: object
      required: [access_token, role, user_id]
      properties:
        access_token: { type: string, description: "JWT; send as an Authorization Bearer token" }
        role: { type: string, enum: [patient, clinician] }
        user_id: { type: string }
    Session:
      type: object
      required: [session_id, started_at, camera_consent]
      properties:
        session_id: { type: string }
        started_at: { type: string, format: date-time }
        camera_consent: { type: boolean }

    TokenPayload:
      type: object
      required: [text]
      properties:
        text: { type: string }

    CrisisPayload:
      type: object
      required: [message, resources, review_flag_created]
      properties:
        message: { type: string }
        resources:
          type: array
          items:
            type: object
            required: [name, contact]
            properties:
              name: { type: string, example: 988 Suicide & Crisis Lifeline }
              contact: { type: string, example: call or text 988 }
        review_flag_created:
          type: boolean
          description: >
            True when a review flag was recorded for the patient's clinician. Until M3-10 the flag is
            kept in the gateway's memory only and is lost on restart; it is not yet in the database.

    DonePayload:
      type: object
      required: [message_id, context]
      properties:
        message_id: { type: string }
        context:
          type: object
          description: The context object used for this turn (see context_object.schema.json)

    PatientSummary:
      type: object
      required: [patient_id, display_name, needs_review]
      properties:
        patient_id: { type: string }
        display_name: { type: string }
        last_session_at: { type: [string, "null"], format: date-time }
        needs_review: { type: boolean }

    TrendPoint:
      type: object
      required: [ts, visual_status, tone_mode]
      properties:
        ts: { type: string, format: date-time }
        visual_status: { type: string, enum: [ok, uncertain, dropped, camera_off] }
        visual_top2:
          type: [array, "null"]
          maxItems: 2
          items: { $ref: "#/components/schemas/TrendLabelProb" }
        text_top2:
          type: [array, "null"]
          maxItems: 2
          items: { $ref: "#/components/schemas/TrendLabelProb" }
        tone_mode: { type: string, enum: [coach, supportive] }

    ReviewFlagAcknowledgement:
      type: object
      required: [reviewed]
      properties:
        reviewed: { type: boolean, const: true }