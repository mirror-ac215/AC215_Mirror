schema: '2.0'
stages:
  fer2013_preprocess:
    cmd: uv run --project pipelines/data-preprocess mirror-preprocess --params 
      pipelines/data-preprocess/params.yaml
    deps:
    - path: data/raw/fer2013/archive.zip
      hash: md5
      md5: 9f58794746ff496be12cf0bb2679e3d4
      size: 63252113
    - path: pipelines/data-preprocess/params.yaml
      hash: md5
      md5: 5cb0e0739e0da7ab1ba96a72a0f7e0ac
      size: 606
    - path: pipelines/data-preprocess/pyproject.toml
      hash: md5
      md5: e1f093cb58378f8002d9ce784915abae
      size: 609
    - path: pipelines/data-preprocess/src/mirror_data_preprocess/__init__.py
      hash: md5
      md5: c6c8bd54129bdcc2ca62606e2262c0ce
      size: 54
    - path: pipelines/data-preprocess/src/mirror_data_preprocess/cli.py
      hash: md5
      md5: fd6d2f66a0e1ea901c372a03878ac857
      size: 1657
    - path: pipelines/data-preprocess/src/mirror_data_preprocess/pipeline.py
      hash: md5
      md5: fcdd09aaab691096b8cc980980d697fa
      size: 8093
    - path: pipelines/data-preprocess/src/mirror_data_preprocess/publish.py
      hash: md5
      md5: 8d267594be86dcf5c4d849d9aa272690
      size: 2409
    - path: pipelines/data-preprocess/uv.lock
      hash: md5
      md5: 13d9d875c7b4458783cfafe683ee341d
      size: 68622
    params:
      pipelines/data-preprocess/params.yaml:
        dataset:
          raw_archive: data/raw/fer2013/archive.zip
          class_order:
          - angry
          - disgust
          - fear
          - happy
          - neutral
          - sad
          - surprise
        image:
          stored_format: png
          stored_width: 48
          stored_height: 48
          stored_channels: 1
        inference_transform:
          grayscale_to_channels: 3
          resize:
          - 224
          - 224
          pixel_range:
          - 0.0
          - 1.0
          mean:
          - 0.485
          - 0.456
          - 0.406
          std:
          - 0.229
          - 0.224
          - 0.225
        output:
          local_dir: data/processed/fer2013/v1
          gcs_uri: gs://mirror-ac215-data/data/processed/fer2013/v1/
          publish_workers: 32
        split:
          train_fraction: 0.8
          validation_fraction: 0.2
          seed: 42
          test_source: provided_test_directory
    outs:
    - path: data/processed/fer2013/v1
      hash: md5
      md5: b9c06fc9a66880c70c51e4916d6d88de.dir
      size: 65385909
      nfiles: 35892
  persona_clean:
    cmd: uv run --project pipelines/persona-data mirror-persona-data --params 
      pipelines/persona-data/params.yaml
    deps:
    - path: data/raw/persona
      hash: md5
      md5: a9bba215e80c5e7a55dccf508e81ac75.dir
      size: 337232
      nfiles: 4
    - path: pipelines/persona-data/pyproject.toml
      hash: md5
      md5: 5486ef9f7c4052b7d91302af143737cc
      size: 570
    - path: pipelines/persona-data/src/mirror_persona_data/cli.py
      hash: md5
      md5: 00a1b02d7e446a1275b406bc860bb357
      size: 836
    - path: pipelines/persona-data/src/mirror_persona_data/pipeline.py
      hash: md5
      md5: 7b753f13fdf84e550984ac8f09a84ed6
      size: 5695
    - path: pipelines/persona-data/uv.lock
      hash: md5
      md5: 8ca562a482c391bb2ef2d778481f2ccb
      size: 13963
    params:
      pipelines/persona-data/params.yaml:
        clean:
          min_response_chars: 12
          max_response_chars: 1000
        identity_filters:
          doctor_title: "\\bI(?: a|')m (?:a )?dr\\.?\\b|\\bI(?: a|')m doctor\\b"
          clinical_role: "\\b(?:as|I(?: a|')m|I was|I've been) an? (?:\\w+ ){0,3}(?:psychologist|psychiatrist|therapist|psychotherapist|counsell?or|physician|doctor|clinician|practitioner)\\\
            b"
          professor_claim: "\\b(?:as|I(?: a|')m|I was|I've been) an? (?:\\w+ ){0,3}professor\\\
            b"
          my_patients: \bmy (?:patients|clients|clinical practice|practice)\b
          clinical_experience: \bin my (?:clinical|therapeutic) 
            (?:practice|work|experience)\b
          my_works: \bmy (?:book|books|lectures?|podcast|students)\b
          named_identity: \b(?:Jordan (?:B\. )?Peterson|Peterson|University of 
            Toronto|Harvard professor|12 Rules for Life|Maps of Meaning|Beyond 
            Order|Tammy|Mikhaila)\b
        input:
          raw_dir: data/raw/persona
          glob: jbp_clean_full.csv
          prompt_column: question
          response_column: answer
        prompt_filters:
        - named_identity
        split:
          seed: 215
          train: 0.8
          val: 0.1
    outs:
    - path: data/processed/persona/v1
      hash: md5
      md5: 62c01999a3195639ded2b12a47b48269.dir
      size: 60840
      nfiles: 5
