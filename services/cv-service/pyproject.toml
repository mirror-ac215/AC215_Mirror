[project]
name = "mirror-cv-service"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-cloud-storage>=3.5.0",
    "numpy>=2.4.0",
    "opencv-python-headless>=4.13.0.92,<5",
    "pillow>=12.1.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.22",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
