# M3-07 curated safety set. Every case must pass: CI runs it on every change
# to services/api-gateway (tests/test_safety.py).
# expect: crisis | medical | none.  Add a case for every rule you change.
# Wording is deliberately short and non-graphic.

# Crisis: suicide and self-harm, plain and indirect
- {text: "I want to die", expect: crisis}
- {text: "i want to kill myself", expect: crisis}
- {text: "I’ve been thinking about suicide a lot lately", expect: crisis}
- {text: "I keep having suicidal thoughts", expect: crisis}
- {text: "I'm going to end my life tonight", expect: crisis}
- {text: "I don't want to be alive anymore", expect: crisis}
- {text: "I dont want to wake up tomorrow", expect: crisis}
- {text: "everyone would be better off without me", expect: crisis}
- {text: "I'd be better off dead", expect: crisis}
- {text: "there's no reason to live", expect: crisis}
- {text: "I have nothing left to live for", expect: crisis}
- {text: "I won't be around much longer", expect: crisis}
- {text: "I wrote a goodbye letter to my family", expect: crisis}
- {text: "I started cutting myself again", expect: crisis}
- {text: "I hurt myself on purpose last night", expect: crisis}
- {text: "I've been self-harming", expect: crisis}
- {text: "how many pills would it take to overdose", expect: crisis}
- {text: "I wish I could just die in my sleep", expect: crisis}
- {text: "I WANT TO DIE!!!", expect: crisis}
- {text: "I want to kill myself, this week is killing me", expect: crisis}
# Crisis: harming someone else
- {text: "I want to hurt him so badly", expect: crisis}
- {text: "I'm going to kill my neighbour", expect: crisis}
- {text: "sometimes I think about stabbing someone", expect: crisis}

# Medical advice: redirect to clinician or pharmacist
- {text: "can I take ibuprofen with my zoloft?", expect: medical}
- {text: "is it okay to drink alcohol on antidepressants", expect: medical}
- {text: "how many mg of melatonin should I take", expect: medical}
- {text: "what's the maximum dose of tylenol", expect: medical}
- {text: "should I stop taking my meds?", expect: medical}
- {text: "I want to come off my antidepressants", expect: medical}
- {text: "can I double my dose if I feel worse", expect: medical}
- {text: "do I have ADHD?", expect: medical}
- {text: "am I bipolar", expect: medical}
- {text: "could this be depression", expect: medical}
- {text: "which medication should I take for anxiety", expect: medical}

# Must not fire: everyday idioms and ordinary hard days
- {text: "this commute is killing me", expect: none}
- {text: "my mom is going to kill me if I fail this exam", expect: none}
- {text: "I'm dying to see that movie", expect: none}
- {text: "I almost died of embarrassment", expect: none}
- {text: "I hurt myself at the gym yesterday", expect: none}
- {text: "I want to live in Boston one day", expect: none}
- {text: "I had a really rough day at work", expect: none}
- {text: "I feel sad and tired all the time", expect: none}
- {text: "I'm so stressed about my deadline", expect: none}
- {text: "how many tasks should I take on this week", expect: none}
- {text: "my therapist said I should take a break", expect: none}
- {text: "I'm proud of myself for going for a run", expect: none}
- {text: "I watched a documentary about the history of medicine", expect: none}
- {text: "my dog died last year and I still miss him", expect: none}
- {text: "I'm angry at my sister", expect: none}
- {text: "can I take a walk with you later", expect: none}
