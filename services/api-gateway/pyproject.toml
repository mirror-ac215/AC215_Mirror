[project]
name = "mirror-api-gateway"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "prometheus-client>=0.23",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "torch>=2.9.1",
    "transformers>=4.57.0",
    "uvicorn>=0.54.0",
]

# CPU-only PyTorch wheels (same as cv-service): the gateway never uses a GPU,
# and the CUDA wheels would add several GB to the image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
