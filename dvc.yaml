stages:
  fer2013_preprocess:
    cmd: PYTHONPATH=pipelines/data-preprocess/src uv run --project pipelines/data-preprocess mirror-preprocess --params pipelines/data-preprocess/params.yaml
    deps:
      - data/raw/fer2013/archive.zip
      - pipelines/data-preprocess/src/mirror_data_preprocess/__init__.py
      - pipelines/data-preprocess/src/mirror_data_preprocess/cli.py
      - pipelines/data-preprocess/src/mirror_data_preprocess/pipeline.py
      - pipelines/data-preprocess/src/mirror_data_preprocess/publish.py
      - pipelines/data-preprocess/pyproject.toml
      - pipelines/data-preprocess/uv.lock
      - pipelines/data-preprocess/params.yaml
    params:
      - pipelines/data-preprocess/params.yaml:
          - dataset
          - split
          - output
          - image
          - inference_transform
    outs:
      - data/processed/fer2013/v1
  persona_clean:
    cmd: PYTHONPATH=pipelines/persona-data/src uv run --project pipelines/persona-data mirror-persona-data --params pipelines/persona-data/params.yaml
    deps:
      - data/raw/persona
      - pipelines/persona-data/src/mirror_persona_data/pipeline.py
      - pipelines/persona-data/src/mirror_persona_data/cli.py
      - pipelines/persona-data/pyproject.toml
      - pipelines/persona-data/uv.lock
    params:
      - pipelines/persona-data/params.yaml:
          - input
          - clean
          - identity_filters
          - prompt_filters
          - split
    outs:
      - data/processed/persona/v1
