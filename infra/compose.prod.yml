# Production-only override. Keep infra/compose.yml unchanged for local laptop/CI.
# Invoke with: docker compose --env-file infra/.env.prod -f infra/compose.yml -f infra/compose.prod.yml up -d --wait
# Sends container logs to Cloud Logging (see docs/monitoring.md). The database is left out.
x-cloud-logging: &cloud-logging
  driver: gcplogs

services:
  db:
    restart: unless-stopped
    # compose.yml has public local defaults; production must never fall back to them.
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in infra/.env.prod}
      POSTGRES_USER: ${DB_USER:?set DB_USER in infra/.env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env.prod}
      MIRROR_DEMO_PASSWORD: ${MIRROR_DEMO_PASSWORD:?set MIRROR_DEMO_PASSWORD in infra/.env.prod}

  api-gateway:
    ports: !reset []
    restart: unless-stopped
    logging: *cloud-logging
    environment:
      DATABASE_URL: postgresql://${DB_USER:?set DB_USER in infra/.env.prod}:${DB_PASSWORD:?set DB_PASSWORD in infra/.env.prod}@db:5432/${DB_NAME:?set DB_NAME in infra/.env.prod}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in infra/.env.prod}
      # Only the Caddy address fixed below can supply X-Forwarded-For.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-["172.30.0.2/32"]}
    networks:
      default: {}
      caddy-proxy: {}

  llm-service:
    build:
      context: ../services/llm-service
      target: real
    gpus: all
    restart: unless-stopped
    logging: *cloud-logging
    environment:
      MOCK_MODE: "0"
      MODEL_NAME: ${LLM_MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}
      SERVED_MODEL_NAME: ${LLM_SERVED_MODEL_NAME:-mirror-persona-v1}
      GPU_MEMORY_UTILIZATION: ${LLM_GPU_MEMORY_UTILIZATION:-0.9}
      DTYPE: ${LLM_DTYPE:-auto}
      MAX_MODEL_LEN: ${LLM_MAX_MODEL_LEN:-2048}
      MAX_NUM_SEQS: ${LLM_MAX_NUM_SEQS:-1}
      # FlashInfer's sampler crashes on the deployed T4/vLLM combination.
      # Keep this explicit in Git rather than relying on a VM-only edit.
      VLLM_USE_FLASHINFER_SAMPLER: "${VLLM_USE_FLASHINFER_SAMPLER:-0}"
    volumes:
      - hf-cache:/root/.cache/huggingface

  cv-service:
    # Always on in production. It reads the model with the VM's own identity
    # (mirror-vm-runtime), so no credential file is set or mounted.
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped
    logging: *cloud-logging
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: !reset null
    volumes: !reset []

  frontend:
    ports: !reset []
    restart: unless-stopped
    logging: *cloud-logging
    networks:
      caddy-proxy: {}
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK_API: "false"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *cloud-logging
    networks:
      caddy-proxy:
        ipv4_address: 172.30.0.2
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN in infra/.env.prod}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

networks:
  caddy-proxy:
    name: mirror-caddy-proxy
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Reserve low addresses for fixed infrastructure such as Caddy at .2.
          ip_range: 172.30.0.128/25

volumes:
  hf-cache:
  caddy-data:
  caddy-config:
