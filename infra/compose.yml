# Runs the Mirror stack locally; docker compose -f infra/compose.yml up --build
# Paths below are relative to this file (infra/), so services live in ../services.
name: mirror

services:
  db:
    build: ../services/db
    environment:
      # DB_* is the M4 database contract; map it explicitly to the official
      # Postgres image variables so gateway and database share one identity.
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in infra/.env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in infra/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env}
      MIRROR_DEMO_PASSWORD: ${MIRROR_DEMO_PASSWORD:?set MIRROR_DEMO_PASSWORD in infra/.env}
    volumes:
      - db-data:/var/lib/postgresql/data

  api-gateway:
    build: ../services/api-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:?set DB_USER in infra/.env}:${DB_PASSWORD:?set DB_PASSWORD in infra/.env}@db:5432/${DB_NAME:?set DB_NAME in infra/.env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in infra/.env}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-30}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-[]}
      LLM_MODEL: mirror-persona-v1
    depends_on:
      db:
        condition: service_healthy
      llm-service:
        condition: service_healthy

  llm-service:
    build: ../services/llm-service   # default target = mock (no GPU, no model download)

  cv-service:
    profiles: ["cv"]
    build: ../services/cv-service
    ports:
      - "8001:8001"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/adc.json
      MODEL_BUCKET: ${CV_MODEL_BUCKET:-mirror-ac215-data}
      MODEL_OBJECT: ${CV_MODEL_OBJECT:-models/cv/v4/vit_b16_v4.pth}
      MODEL_VERSION: ${CV_MODEL_VERSION:-cv-vit-b16-v4}
    volumes:
      - ${CV_GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/var/secrets/google/adc.json:ro

  frontend:
    build: ../services/frontend
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy

  # Monitoring (M4-08), opt-in: add `--profile monitoring` to the compose command.
  # Neither service is public: Prometheus has no host port and reaches the gateway
  # on the compose network only; Grafana listens on this machine's loopback only.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Read-only, provisioned view: nobody can log in, therefore no admin password
      # is needed, and the dashboard and datasource cannot be edited from the UI.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mirror-gateway.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/mirror-gateway.json:/var/lib/grafana/dashboards/mirror-gateway.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  db-data:
  prometheus-data:
  grafana-data: