# Runs the Mirror stack locally; docker compose -f infra/compose.yml up --build
# Paths below are relative to this file (infra/), so services live in ../services.
name: mirror

services:
  db:
    build: ../services/db
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      MIRROR_DEMO_PASSWORD: ${MIRROR_DEMO_PASSWORD:?set MIRROR_DEMO_PASSWORD in infra/.env}
    volumes:
      - db-data:/var/lib/postgresql/data

  api-gateway:
    build: ../services/api-gateway
    ports:
      - "8000:8000"
    environment:
      MIRROR_DEMO_PASSWORD: ${MIRROR_DEMO_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      llm-service:
        condition: service_healthy

  llm-service:
    build: ../services/llm-service   # default target = mock (no GPU, no model download)

  cv-service:
    profiles: ["cv"]
    build: ../services/cv-service
    ports:
      - "8001:8001"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/adc.json
      MODEL_BUCKET: ${CV_MODEL_BUCKET:-mirror-ac215-data}
      MODEL_OBJECT: ${CV_MODEL_OBJECT:-models/cv/inherited-v3/vit_b16_v3_best.pth}
      MODEL_VERSION: ${CV_MODEL_VERSION:-cv-vit-b16-v3}
    volumes:
      - ${CV_GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/var/secrets/google/adc.json:ro

  frontend:
    build: ../services/frontend
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  db-data: