apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: db
          image: ${MIRROR_IMAGE_REGISTRY}/${MIRROR_IMAGE_REPOSITORY}/mirror-db:${MIRROR_IMAGE_TAG}
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: mirror-runtime } }]
          readinessProbe: { tcpSocket: { port: 5432 } }
---
apiVersion: v1
kind: Service
metadata: { name: db }
spec:
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]
