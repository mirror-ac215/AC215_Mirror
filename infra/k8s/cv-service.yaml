apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: cv-service }
  template:
    metadata:
      labels: { app: cv-service }
    spec:
      containers:
        - name: cv-service
          image: ${MIRROR_IMAGE_REGISTRY}/${MIRROR_IMAGE_REPOSITORY}/mirror-cv-service:${MIRROR_IMAGE_TAG}
          ports: [{ containerPort: 8001 }]
          envFrom: [{ secretRef: { name: mirror-runtime } }]
          readinessProbe: { httpGet: { path: /health, port: 8001 } }
          livenessProbe: { httpGet: { path: /health, port: 8001 } }
---
apiVersion: v1
kind: Service
metadata: { name: cv-service }
spec:
  selector: { app: cv-service }
  ports: [{ port: 8001, targetPort: 8001 }]
