apiVersion: v1
kind: ServiceAccount
metadata:
  name: mirror-cv-service
  annotations:
    # Non-secret Google service-account email. Mostafa creates the binding.
    iam.gke.io/gcp-service-account: ${MIRROR_CV_GSA}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: cv-service }
  template:
    metadata:
      labels: { app: cv-service }
    spec:
      serviceAccountName: mirror-cv-service
      containers:
        - name: cv-service
          image: ${MIRROR_IMAGE_REGISTRY}/${MIRROR_IMAGE_REPOSITORY}/mirror-cv-service:${MIRROR_IMAGE_TAG}
          ports: [{ containerPort: 8001 }]
          envFrom: [{ secretRef: { name: mirror-runtime } }]
          env:
            - name: MODEL_BUCKET
              value: ${MIRROR_CV_MODEL_BUCKET}
            - name: MODEL_OBJECT
              value: ${MIRROR_CV_MODEL_OBJECT}
            - name: MODEL_VERSION
              value: ${MIRROR_CV_MODEL_VERSION}
          startupProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe: { httpGet: { path: /health, port: 8001 } }
          livenessProbe: { httpGet: { path: /health, port: 8001 } }
---
apiVersion: v1
kind: Service
metadata: { name: cv-service }
spec:
  selector: { app: cv-service }
  ports: [{ port: 8001, targetPort: 8001 }]
