apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: llm-service }
  template:
    metadata:
      labels: { app: llm-service }
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4
      containers:
        - name: llm-service
          image: ${MIRROR_IMAGE_REGISTRY}/${MIRROR_IMAGE_REPOSITORY}/mirror-llm-service:${MIRROR_IMAGE_TAG}
          ports: [{ containerPort: 8002 }]
          envFrom: [{ secretRef: { name: mirror-runtime } }]
          resources:
            limits: { nvidia.com/gpu: 1 }
          readinessProbe: { httpGet: { path: /health, port: 8002 } }
          livenessProbe: { httpGet: { path: /health, port: 8002 } }
---
apiVersion: v1
kind: Service
metadata: { name: llm-service }
spec:
  selector: { app: llm-service }
  ports: [{ port: 8002, targetPort: 8002 }]
