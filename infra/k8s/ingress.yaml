apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirror
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  tls:
    - hosts: ["${MIRROR_DOMAIN}"]
      secretName: mirror-tls
  rules:
    - host: "${MIRROR_DOMAIN}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
