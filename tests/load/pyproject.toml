[project]
name = "mirror-load-test"
version = "0.1.0"
description = "M4-07: Locust load test for the api-gateway (5 patients at once, camera on or off)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "locust>=2.37.0",
    "pillow>=11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_load"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
