name: Python service CI

on:
  workflow_call:
    inputs:
      service_path:
        description: Path to the Python service or job to validate.
        required: true
        type: string
      image_name:
        description: Local Docker image tag used only during the CI build. Leave empty for a job with no Dockerfile.
        required: false
        default: ""
        type: string
      coverage:
        description: Measure coverage and enforce the service's fail_under threshold (M4-20).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-lint-build:
    name: ${{ inputs.service_path }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run pytest
        if: ${{ !inputs.coverage }}
        run: uv run pytest -v

      - name: Run pytest with coverage gate
        if: ${{ inputs.coverage }}
        run: |
          set -o pipefail
          uv run pytest -v --cov --cov-report=term-missing --cov-report=xml | tee coverage.txt

      - name: Publish coverage summary
        if: ${{ always() && inputs.coverage }}
        run: |
          {
            echo "### Coverage: ${{ inputs.service_path }}"
            echo '```'
            sed -n '/coverage: platform/,/^TOTAL/p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Docker image
        if: inputs.image_name != ''
        run: docker build --tag "${{ inputs.image_name }}" .
