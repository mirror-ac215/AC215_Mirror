name: Python service CI

on:
  workflow_call:
    inputs:
      service_path:
        description: Path to the Python service or job to validate.
        required: true
        type: string
      image_name:
        description: Local Docker image tag used only during the CI build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-lint-build:
    name: ${{ inputs.service_path }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build --tag "${{ inputs.image_name }}" .
