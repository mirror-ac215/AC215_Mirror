name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      service_template: ${{ steps.filter.outputs.service_template }}
      api_gateway: ${{ steps.filter.outputs.api_gateway }}
      db: ${{ steps.filter.outputs.db }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs_contracts: ${{ steps.filter.outputs.docs_contracts }}
      compose: ${{ steps.filter.outputs.compose }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            service_template:
              - 'services/_template/**'
              - '.github/workflows/**'
            api_gateway:
              - 'services/api-gateway/**'
              - '.github/workflows/**'
            db:
              - 'services/db/**'
              - '.github/workflows/**'
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/**'
            docs_contracts:
              - 'docs/contracts/**'
              - '.github/workflows/**'
            compose:
              - 'infra/**'
              - 'services/frontend/**'
              - 'services/api-gateway/**'
              - 'services/db/**'
              - '.github/workflows/**'

  service_template:
    name: Service template checks
    needs: changes
    if: needs.changes.outputs.service_template == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/_template
      image_name: mirror-service-template-ci

  api_gateway:
    name: API gateway checks
    needs: changes
    if: needs.changes.outputs.api_gateway == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/api-gateway
      image_name: mirror-api-gateway-ci

  db:
    name: Database integration checks
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run database container integration test
        run: bash services/db/tests/test_database.sh

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Check out reopsitory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t mirror-frontend-ci .

  contract_validation:
    name: Contract validation
    needs: changes
    if: needs.changes.outputs.docs_contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Validate shared contracts
        run: uv run python validate.py

      - name: Run validator tests
        run: uv run pytest -v

  compose:
    name: Compose stake smoke test
    needs: changes
    if : needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      # Throwaway values for CI only. Compose reads these instead of infra/.env.
      POSTGRES_PASSWORD: ci-only-password
      MIRROR_DEMO_PASSWORD: ci-only-demo-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file
        run: docker compose -f infra/compose.yml config --quiet

      - name: Build and start the stack, wait for every health check
        run: docker compose -f infra/compose.yml up --build --wait --wait-timeout 300

      - name: Smoke-test the running services
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/health

      - name: Show logs if anything failed
        if: failure()
        run: docker compose -f infra/compose.yml logs

      - name: Stop and remove stack
        if: always()
        run: docker compose -f infra/compose.yml down -v

  ci_summary:
    name: CI summary
    needs: [changes, service_template, db, frontend, contract_validation, api_gateway, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required component checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SERVICE_TEMPLATE_CHANGED: ${{ needs.changes.outputs.service_template }}
          SERVICE_TEMPLATE_RESULT: ${{ needs.service_template.result }}
          API_GATEWAY_CHANGED: ${{ needs.changes.outputs.api_gateway }}
          API_GATEWAY_RESULT: ${{ needs.api_gateway.result }}
          DB_CHANGED: ${{ needs.changes.outputs.db }}
          DB_RESULT: ${{ needs.db.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCS_CONTRACTS_CHANGED: ${{ needs.changes.outputs.docs_contracts }}
          CONTRACT_VALIDATION_RESULT: ${{ needs.contract_validation.result }}
          COMPOSE_CHANGED: ${{ needs.changes.outputs.compose }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changed-component detection did not pass: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$SERVICE_TEMPLATE_CHANGED" = "true" ] && [ "$SERVICE_TEMPLATE_RESULT" != "success" ]; then
            echo "Service template checks did not pass: $SERVICE_TEMPLATE_RESULT"
            exit 1
          fi

          if [ "$API_GATEWAY_CHANGED" = "true" ] && [ "$API_GATEWAY_RESULT" != "success" ]; then
            echo "API gateway checks did not pass: $API_GATEWAY_RESULT"
            exit 1
          fi

          if [ "$DB_CHANGED" = "true" ] && [ "$DB_RESULT" != "success" ]; then
            echo "Database integration checks did not pass: $DB_RESULT"
            exit 1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Frontend checks did not pass: $FRONTEND_RESULT"
            exit 1
          fi

          if [ "$DOCS_CONTRACTS_CHANGED" = "true" ] && [ "$CONTRACT_VALIDATION_RESULT" != "success" ]; then
            echo "Contract validation did not pass: $CONTRACT_VALIDATION_RESULT"
            exit 1
          fi

          if [ "$COMPOSE_CHANGED" = "true" ] && [ "$COMPOSE_RESULT" != "success" ]; then
            echo "Compose stack smoke test did not pass: $COMPOSE_RESULT"
            exit 1
          fi

          echo "All CI checks required for this pull request passed."
