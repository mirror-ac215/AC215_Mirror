name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      service_template: ${{ steps.filter.outputs.service_template }}
      api_gateway: ${{ steps.filter.outputs.api_gateway }}
      db: ${{ steps.filter.outputs.db }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs_contracts: ${{ steps.filter.outputs.docs_contracts }}
      llm_service: ${{ steps.filter.outputs.llm_service }}
      cv_service: ${{ steps.filter.outputs.cv_service }}
      data_preprocess: ${{ steps.filter.outputs.data_preprocess }}
      persona_data: ${{ steps.filter.outputs.persona_data }}
      cv_eval: ${{ steps.filter.outputs.cv_eval }}
      cv_train: ${{ steps.filter.outputs.cv_train }}
      compose: ${{ steps.filter.outputs.compose }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            service_template:
              - 'services/_template/**'
              - '.github/workflows/**'
            api_gateway:
              - 'services/api-gateway/**'
              - '.github/workflows/**'
            db:
              - 'services/db/**'
              - '.github/workflows/**'
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/**'
            docs_contracts:
              - 'docs/contracts/**'
              - '.github/workflows/**'
            llm_service:
              - 'services/llm-service/**'
              - '.github/workflows/**'
            cv_service:
              - 'services/cv-service/**'
              - '.github/workflows/**'
            data_preprocess:
              - 'pipelines/data-preprocess/**'
              - 'dvc.yaml'
              - '.github/workflows/**'
            persona_data:
              - 'pipelines/persona-data/**'
              - 'dvc.yaml'
              - '.github/workflows/**'
            cv_eval:
              - 'pipelines/cv-eval/**'
              - '.github/workflows/**'
            cv_train:
              - 'pipelines/cv-train/**'
              - '.github/workflows/**'
            compose:
              - 'infra/**'
              - 'services/frontend/**'
              - 'services/api-gateway/**'
              - 'services/db/**'
              - 'services/llm-service/**'
              - '.github/workflows/**'

  service_template:
    name: Service template checks
    needs: changes
    if: needs.changes.outputs.service_template == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/_template
      image_name: mirror-service-template-ci

  api_gateway:
    name: API gateway checks
    needs: changes
    if: needs.changes.outputs.api_gateway == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/api-gateway
      image_name: mirror-api-gateway-ci

  db:
    name: Database integration checks
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run database container integration test
        run: bash services/db/tests/test_database.sh

  llm_service:
    name: LLM service checks
    needs: changes
    if: needs.changes.outputs.llm_service == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/llm-service
      image_name: mirror-llm-service-ci

  cv_service:
    name: CV service checks
    needs: changes
    if: needs.changes.outputs.cv_service == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/cv-service
      image_name: mirror-cv-service-ci

  data_preprocess:
    name: Data preprocess checks
    needs: changes
    if: needs.changes.outputs.data_preprocess == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: pipelines/data-preprocess
      image_name: mirror-data-preprocess-ci

  persona_data:
    name: Persona data checks
    needs: changes
    if: needs.changes.outputs.persona_data == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: pipelines/persona-data
      image_name: mirror-persona-data-ci

  cv_eval:
    name: CV evaluation checks
    needs: changes
    if: needs.changes.outputs.cv_eval == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: pipelines/cv-eval
      image_name: mirror-cv-eval-ci

  cv_train:
    name: CV training checks
    needs: changes
    if: needs.changes.outputs.cv_train == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: pipelines/cv-train
      image_name: mirror-cv-train-ci

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t mirror-frontend-ci .

  contract_validation:
    name: Contract validation
    needs: changes
    if: needs.changes.outputs.docs_contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Validate shared contracts
        run: uv run python validate.py

      - name: Run validator tests
        run: uv run pytest -v

  compose:
    name: Compose stack smoke test
    needs: changes
    if : needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      # Throwaway values for CI only. Compose reads these instead of infra/.env.
      POSTGRES_PASSWORD: ci-only-password
      MIRROR_DEMO_PASSWORD: ci-only-demo-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file
        run: docker compose -f infra/compose.yml config --quiet

      - name: Validate M3-13 Stage A deployment assets
        run: python3 infra/tests/test_stage_a_assets.py

      - name: Build and start the stack, wait for every health check
        run: docker compose -f infra/compose.yml up --build --wait --wait-timeout 300

      - name: Smoke-test the running services
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/health

      - name: Show logs if anything failed
        if: failure()
        run: docker compose -f infra/compose.yml logs

      - name: Stop and remove stack
        if: always()
        run: docker compose -f infra/compose.yml down -v

  ci_summary:
    name: CI summary
    needs: [changes, service_template, db, llm_service, cv_service, data_preprocess, persona_data, cv_eval, cv_train, frontend, contract_validation, api_gateway, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required component checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SERVICE_TEMPLATE_CHANGED: ${{ needs.changes.outputs.service_template }}
          SERVICE_TEMPLATE_RESULT: ${{ needs.service_template.result }}
          API_GATEWAY_CHANGED: ${{ needs.changes.outputs.api_gateway }}
          API_GATEWAY_RESULT: ${{ needs.api_gateway.result }}
          DB_CHANGED: ${{ needs.changes.outputs.db }}
          DB_RESULT: ${{ needs.db.result }}
          LLM_SERVICE_CHANGED: ${{ needs.changes.outputs.llm_service }}
          LLM_SERVICE_RESULT: ${{ needs.llm_service.result }}
          CV_SERVICE_CHANGED: ${{ needs.changes.outputs.cv_service }}
          CV_SERVICE_RESULT: ${{ needs.cv_service.result }}
          DATA_PREPROCESS_CHANGED: ${{ needs.changes.outputs.data_preprocess }}
          DATA_PREPROCESS_RESULT: ${{ needs.data_preprocess.result }}
          PERSONA_DATA_CHANGED: ${{ needs.changes.outputs.persona_data }}
          PERSONA_DATA_RESULT: ${{ needs.persona_data.result }}
          CV_EVAL_CHANGED: ${{ needs.changes.outputs.cv_eval }}
          CV_EVAL_RESULT: ${{ needs.cv_eval.result }}
          CV_TRAIN_CHANGED: ${{ needs.changes.outputs.cv_train }}
          CV_TRAIN_RESULT: ${{ needs.cv_train.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCS_CONTRACTS_CHANGED: ${{ needs.changes.outputs.docs_contracts }}
          CONTRACT_VALIDATION_RESULT: ${{ needs.contract_validation.result }}
          COMPOSE_CHANGED: ${{ needs.changes.outputs.compose }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changed-component detection did not pass: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$SERVICE_TEMPLATE_CHANGED" = "true" ] && [ "$SERVICE_TEMPLATE_RESULT" != "success" ]; then
            echo "Service template checks did not pass: $SERVICE_TEMPLATE_RESULT"
            exit 1
          fi

          if [ "$API_GATEWAY_CHANGED" = "true" ] && [ "$API_GATEWAY_RESULT" != "success" ]; then
            echo "API gateway checks did not pass: $API_GATEWAY_RESULT"
            exit 1
          fi

          if [ "$DB_CHANGED" = "true" ] && [ "$DB_RESULT" != "success" ]; then
            echo "Database integration checks did not pass: $DB_RESULT"
            exit 1
          fi

          if [ "$LLM_SERVICE_CHANGED" = "true" ] && [ "$LLM_SERVICE_RESULT" != "success" ]; then
            echo "LLM service checks did not pass: $LLM_SERVICE_RESULT"
            exit 1
          fi

          if [ "$CV_SERVICE_CHANGED" = "true" ] && [ "$CV_SERVICE_RESULT" != "success" ]; then
            echo "CV service checks did not pass: $CV_SERVICE_RESULT"
            exit 1
          fi

          if [ "$DATA_PREPROCESS_CHANGED" = "true" ] && [ "$DATA_PREPROCESS_RESULT" != "success" ]; then
            echo "Data preprocess checks did not pass: $DATA_PREPROCESS_RESULT"
            exit 1
          fi

          if [ "$PERSONA_DATA_CHANGED" = "true" ] && [ "$PERSONA_DATA_RESULT" != "success" ]; then
            echo "Persona data checks did not pass: $PERSONA_DATA_RESULT"
            exit 1
          fi
          if [ "$CV_EVAL_CHANGED" = "true" ] && [ "$CV_EVAL_RESULT" != "success" ]; then
            echo "CV evaluation checks did not pass: $CV_EVAL_RESULT"
            exit 1
          fi

          if [ "$CV_TRAIN_CHANGED" = "true" ] && [ "$CV_TRAIN_RESULT" != "success" ]; then
            echo "CV training checks did not pass: $CV_TRAIN_RESULT"
            exit 1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Frontend checks did not pass: $FRONTEND_RESULT"
            exit 1
          fi

          if [ "$DOCS_CONTRACTS_CHANGED" = "true" ] && [ "$CONTRACT_VALIDATION_RESULT" != "success" ]; then
            echo "Contract validation did not pass: $CONTRACT_VALIDATION_RESULT"
            exit 1
          fi

          if [ "$COMPOSE_CHANGED" = "true" ] && [ "$COMPOSE_RESULT" != "success" ]; then
            echo "Compose stack smoke test did not pass: $COMPOSE_RESULT"
            exit 1
          fi

          echo "All CI checks required for this pull request passed."
