# M2-17 baseline recipe: the exact settings that produced cv-vit-b16-v3
# (vit_b16_v3_best.pth, test macro-F1 0.6445). Change a value here, not in code.

model:
  name: cv-vit-b16
  version: v3                      # the inherited checkpoint's version
  architecture: vit_b_16           # torchvision, ImageNet-pretrained
  head_dropout: 0.5                # head = Dropout(0.5) + Linear(768, 7)
  pretrained: true

data:
  image_size: 224                  # grey 48x48 -> 3 channels -> 224x224, ImageNet mean/std
  batch_size: 32

augmentation:                      # train only; val/test use the plain eval transform
  hflip_p: 0.5
  affine_degrees: 10
  affine_translate: 0.05
  affine_scale: [0.9, 1.1]
  color_jitter: [0.4, 0.4, 0.2]    # brightness, contrast, saturation
  blur_p: 0.5                      # softens images like a live webcam
  blur_sigma: [0.2, 2.0]
  erasing_p: 0.25

imbalance:
  sampler_strength: 0.5            # 0 = uniform, 0.5 = sqrt rebalancing, 1 = fully balanced
  class_weights: sqrt              # focal-loss alpha: inverse | sqrt | effective | none

mixup:
  prob: 0.5                        # share of batches mixed
  mixup_ratio: 0.5                 # of those: Mixup vs CutMix
  mixup_alpha: 0.2
  cutmix_alpha: 1.0

loss:
  name: focal
  gamma: 2.0
  label_smoothing: 0.1

optimizer:
  name: adamw
  lr: 1.0e-5
  weight_decay: 1.0e-4

scheduler:                         # ReduceLROnPlateau on validation loss
  factor: 0.5
  patience: 2

training:
  epochs: 8
  seed: 42
  early_stopping_patience: null    # the baseline ran a fixed 8 epochs and kept the best val epoch
