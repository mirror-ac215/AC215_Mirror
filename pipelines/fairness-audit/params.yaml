# M3-02 fairness audit. Change values here, not in code: the report records them all.

model:
  version: cv-vit-b16-v4                       # docs/artifacts.md
  status: candidate (not yet served)           # cv-service serves v3 until it switches (#61)
  uri: gs://mirror-ac215-data/models/cv/v4/vit_b16_v4.pth
  sha256: 5b003e0a18578e570672d2b58742548b91247a75b9ba3bd5f484750eee1e862b  # score refuses any other file

data:
  name: FairFace validation (padding 0.25)    # Karkkainen & Joo, WACV 2021; CC BY 4.0
  version: fairface/v1-val
  source: HuggingFaceM4/FairFace               # config "0.25", split "validation" (README)
  revision: "54d573cdb8b5af490ba8da9da2799628f6e5c496"  # Hugging Face commit, see README
