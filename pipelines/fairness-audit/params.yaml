# cv-service's face detector (M4-26, PR #118: YuNet replaces the Haar cascade). A test keeps
# these equal to services/cv-service/app/runtime.py and app/fetch_models.py. The path is
# relative to this file. The file is not in Git; the tests download it from `url` (pinned
# opencv_zoo commit) and the audit refuses it if its sha256 differs.
detector:
  name: yunet-2023mar
  model: ../../services/cv-service/app/models/face_detection_yunet_2023mar.onnx
  url: https://media.githubusercontent.com/media/opencv/opencv_zoo/f12e12798e8314f7c074a6656816c048dcc95b7a/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
  sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
  score_threshold: 0.9

# The gateway's gate (services/api-gateway/app/config.py, M3-04). A test keeps these
# equal to the gateway defaults. A photo is one steady frame: stability is always 1.0,
# and only the top-probability and margin rules can fail. The window settings are
# listed for the report; they do not apply to a single photo.
gate:
  min_top_prob: 0.45
  min_margin: 0.05
  min_stability: 0.50
  window_s: 10.0
  min_frames: 3
  min_face_ratio: 0.5

groups:
  attributes: [race, gender, age]
  # Mirror's patients are adults and teenagers; young children's faces and expressions
  # differ and would dominate the age gaps. Still scored, reported separately.
  exclude_ages: ["0-2", "3-9"]
  min_group_size: 100        # smaller groups are listed but never named as the largest gap
