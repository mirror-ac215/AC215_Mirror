# M2-09 persona-data parameters. Change these, then `dvc repro persona_clean`.

input:
  raw_dir: data/raw/persona          # restored by `dvc pull raw-persona.dvc`
  # Only the full file: jbp_train/val/test.csv are an old split of the same rows,
  # so reading them too would count every pair twice.
  glob: jbp_clean_full.csv
  prompt_column: question
  response_column: answer
  # Ignored on purpose: a_len, q_len (recomputed if needed) and `formatted`
  # (old training prompt that names a real person; M3-09 builds Mirror's own prompt).

clean:
  min_response_chars: 12             # drop empty / one-word answers
  max_response_chars: 4000           # drop runaway transcripts

# Identity and credential claims the persona must never make (case-insensitive regex).
# Each pattern has an id so the report can say exactly why a pair was removed.
identity_filters:
  doctor_title: "\\bI(?: a|')m (?:a )?dr\\.?\\b|\\bI(?: a|')m doctor\\b"
  clinical_role: "\\b(?:as|I(?: a|')m|I was|I've been) an? (?:\\w+ ){0,3}(?:psychologist|psychiatrist|therapist|psychotherapist|counsell?or|physician|doctor|clinician)\\b"
  professor_claim: "\\b(?:as|I(?: a|')m|I was|I've been) an? (?:\\w+ ){0,3}professor\\b"
  my_patients: "\\bmy (?:patients|clients|clinical practice|practice)\\b"
  clinical_experience: "\\bin my (?:clinical|therapeutic) (?:practice|work|experience)\\b"
  my_works: "\\bmy (?:book|books|lectures?|podcast|students)\\b"
  # The real person behind the source interviews: his name, employer, books and family.
  named_identity: "\\b(?:Jordan (?:B\\. )?Peterson|Peterson|University of Toronto|Harvard professor|12 Rules for Life|Maps of Meaning|Beyond Order|Tammy|Mikhaila)\\b"

split:
  seed: 215
  train: 0.8
  val: 0.1                           # test gets the rest

output:
  local_dir: data/processed/persona/v1
