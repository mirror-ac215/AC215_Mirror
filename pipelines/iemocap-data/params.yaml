# M3-21 IEMOCAP parameters. Change these, then `dvc repro iemocap_build`.

input:
  # The release archive, restored by `dvc pull` (see README). An extracted
  # IEMOCAP_full_release/ folder also works (useful for local checks).
  source: data/raw/iemocap/IEMOCAP_full_release.tar.gz

# IEMOCAP's consensus labels -> Mirror's 7 emotions (the camera model's classes).
# Codes not listed here are dropped and counted in report.json:
#   fru (frustration): no clean match in Mirror's 7; it is not anger.
#   oth (other) and xxx (annotators did not agree).
labels:
  neu: neutral
  hap: joy
  exc: joy        # excited: merged with happiness, as is common in IEMOCAP studies
  sad: sadness
  ang: anger
  fea: fear
  dis: disgust
  sur: surprise

output:
  local_dir: data/processed/iemocap/v1
