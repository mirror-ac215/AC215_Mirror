[project]
name = "mirror-persona-checks"
version = "0.1.0"
description = "M3-09: identity probes and distress scenarios for a new persona adapter"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
]

[project.scripts]
mirror-persona-checks = "mirror_persona_checks.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.11,<0.12",
]

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
