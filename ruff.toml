"services/api-gateway/app/config.py" = ["E501"]
"services/api-gateway/app/fusion.py" = ["E501"]
"services/api-gateway/app/metrics.py" = ["E501"]
"services/api-gateway/app/prompt.py" = ["E501"]
"services/api-gateway/app/repository.py" = ["E501"]
"services/api-gateway/app/safety.py" = ["E501"]
"services/api-gateway/app/text_emotion.py" = ["E501"]
"services/api-gateway/scripts/gate_sweep.py" = ["E501"]
