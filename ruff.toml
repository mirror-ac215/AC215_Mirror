target-version = "py311"
line-length = 100
# Match each component's own working-directory view of first-party packages.
src = [
  "services/api-gateway",
  "services/cv-service",
  "services/llm-service",
  "pipelines/cv-eval/src",
  "pipelines/cv-train/src",
  "pipelines/data-preprocess/src",
  "pipelines/fairness-audit/src",
  "pipelines/iemocap-data/src",
  "pipelines/llm-eval/pairwise/src",
  "pipelines/llm-eval/persona-checks/src",
  "pipelines/llm-finetune/src",
  "pipelines/modality-eval/src",
  "pipelines/persona-data/src",
]
extend-exclude = ["*.md"]

[lint.isort]
known-first-party = [
  "app",
  "mirror_cv_eval",
  "mirror_cv_train",
  "mirror_data_preprocess",
  "mirror_fairness_audit",
  "mirror_iemocap_data",
  "mirror_llm_finetune",
  "mirror_modality_eval",
  "mirror_pairwise",
  "mirror_persona_checks",
  "mirror_persona_data",
]

[lint]
select = ["E", "F", "I"]

# M4-19 baseline: these files contain long, user-facing text or regular expressions.
# New violations elsewhere fail CI; each exception is intentionally scoped to E501.
[lint.per-file-ignores]
"pipelines/cv-eval/scripts/export_frame_probs.py" = ["E501"]
"pipelines/cv-eval/scripts/webcam_demo.py" = ["E501"]
"pipelines/cv-eval/src/mirror_cv_eval/cli.py" = ["E501"]
"pipelines/cv-eval/src/mirror_cv_eval/metrics.py" = ["E501"]
"pipelines/cv-eval/src/mirror_cv_eval/release_check.py" = ["E501"]
"pipelines/cv-eval/tests/test_cli.py" = ["E501"]
"pipelines/cv-eval/tests/test_release_check.py" = ["E501"]
"pipelines/cv-train/scripts/convert_hsemotion.py" = ["E501"]
"pipelines/cv-train/src/mirror_cv_train/cli.py" = ["E501"]
"pipelines/cv-train/src/mirror_cv_train/data.py" = ["E501"]
"pipelines/cv-train/src/mirror_cv_train/model.py" = ["E501"]
"pipelines/cv-train/src/mirror_cv_train/train.py" = ["E501"]
"pipelines/cv-train/tests/test_pieces.py" = ["E501"]
"pipelines/cv-train/tests/test_smoke_run.py" = ["E501"]
"pipelines/data-preprocess/src/mirror_data_preprocess/ferplus.py" = ["E501"]
"pipelines/data-preprocess/src/mirror_data_preprocess/pipeline.py" = ["E501"]
